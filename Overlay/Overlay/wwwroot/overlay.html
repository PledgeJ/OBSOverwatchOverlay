  <title>Overlay</title>

  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>

</head>
<body>

    <!-- This can sit under the in-game UI -->

      <img id="img-ban-team2" src="./Assets/placeholder.png">

      <img id="img-team2" src="./Assets/placeholder.png">

</html>
