<!DOCTYPE html>
<html lang="en">
<head>
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overlay</title>

  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>

</head>
<body>

  <div class="container">
    <div id="col-team1" class="team-container">
      <div class="banner-section">
        <img id="img-team1" src="./Assets/placeholder.png">
        <h1 id="name-team1" class="name">Team 1</h1>
      </div>
      <div class="banner-section">  
        <div class="ban-container">
          <img id="img-ban-team1" src="./Assets/heroes/Kiriko.webp">
          <!-- <span>&#128683;&#65038;</span> -->
          <h1>BAN</h1>
        </div>
        <h1 id="score-team1" class="score">0</h1>
      </div>
    </div>

    <!-- This can sit under the in-game UI -->
    <h1 id="ft-score" class="pill">FT1</h1>

    <div id="col-team2" class="team-container">
      <div class="banner-section">
        <h1 id="score-team2" class="score">0</h1>
        <div class="ban-container">
          <img id="img-ban-team2" src="./Assets/heroes/Doomfist.webp">
          <h1>BAN</h1>
        </div>
      </div>
      <div class="banner-section">
        <h1 id="name-team2" class="name">Team 2</h1>
        <img id="img-team2" src="./Assets/placeholder.png">
      </div>
    </div>
  </div>

</body>
</html>
